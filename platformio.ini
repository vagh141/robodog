; PlatformIO project for the robodog ESP32 sketches.
; Open this folder in VS Code with the PlatformIO extension and it shows up
; under PlatformIO > Projects. Build / Upload / Monitor from the toolbar.

[platformio]
src_dir = ServoSweep
default_envs = servosweep

; --- Servo sweep on GPIO 13 ---------------------------------------------------
[env:servosweep]
; pioarduino fork of the espressif32 platform: ships Arduino core 3.x, which the
; sketch needs for ledcAttach()/ledcWrite(pin, ...). The stock platformio
; espressif32 platform is stuck on core 2.0.x and will not compile it.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.05/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; Leave upload_port unset so PlatformIO auto-detects the board.
; Set it explicitly if you have several serial devices:
; upload_port = /dev/cu.usbserial-0001
; monitor_port = /dev/cu.usbserial-0001
